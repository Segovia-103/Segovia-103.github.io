<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Registro Estudiantil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>REGISTRO ESTUDIANTIL</h2>
        
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre">
            </div>

            <div class="form-group">
                <label for="nie">NIE:</label>
                <input type="text" id="nie">
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad">
            </div>

            <div class="form-group">
                <label for="grado">Grado:</label>
                <select id="grado">
                    <option value="">Seleccionar ▼</option>
                    <option value="1er Año">1.er año</option>
                    <option value="2do Año">2.do año</option>
                    <option value="3er Año">3.er año</option>
                </select>
            </div>

            <div class="form-group">
                <label for="seccion">Sección:</label>
                <select id="seccion">
                    <option value="">Seleccionar ▼</option>
                    <option value="A">Sección A</option>
                    <option value="B">Sección B</option>
                    <option value="C">Sección C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="correo">Correo:</label>
                <input type="email" id="correo">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono">
            </div>

            <button type="submit">REGISTRAR ESTUDIANTE</button>
        </form>

        <div id="mensaje"></div>
        
        <div id="resultado" class="resultado-card" style="display: none;">
            <h3>Datos Registrados:</h3>
            <p><strong>Nombre:</strong> <span id="resNombre"></span></p>
            <p><strong>NIE:</strong> <span id="resNie"></span></p>
            <p><strong>Edad:</strong> <span id="resEdad"></span></p>
            <p><strong>Grado:</strong> <span id="resGrado"></span></p>
            <p><strong>Sección:</strong> <span id="resSeccion"></span></p>
            <p><strong>Correo:</strong> <span id="resCorreo"></span></p>
            <p><strong>Teléfono:</strong> <span id="resTelefono"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
